name: Build and Push Docker Images to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: api-gateway
            context: ./api-gateway
          - name: auth-service
            context: ./services/User-Auth-Service
          - name: course-catalog-service
            context: ./services/Course Catalog Service
          - name: enrollment-service
            context: ./services/Enrollment & Progress Service
          - name: notification-service
            context: ./services/Notification Service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service.name }}:latest "${{ matrix.service.context }}"

      - name: Tag Docker image
        run: |
          docker tag ${{ matrix.service.name }}:latest ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
          docker tag ${{ matrix.service.name }}:latest ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:latest
