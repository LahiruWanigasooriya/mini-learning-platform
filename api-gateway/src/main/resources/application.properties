spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=Enrollments-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/enrollments/**

spring.cloud.gateway.server.webflux.routes[2].id=Course-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8000
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/courses/**