spring.application.name=api-gateway
server.port=8080

# ===== ROUTES =====

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# User Service (mapped to auth-service)
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://auth-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Enrollment Service
spring.cloud.gateway.routes[2].id=enrollment-service
spring.cloud.gateway.routes[2].uri=http://enrollment-service:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/enrollments/**

# Course Catalog Service
spring.cloud.gateway.routes[3].id=course-catalog-service
spring.cloud.gateway.routes[3].uri=http://course-catalog-service:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/courses/**

# Notification Service
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://notification-service:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notifications/**

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
