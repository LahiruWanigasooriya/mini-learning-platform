spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
 
spring.cloud.gateway.server.webflux.routes[4].id=user-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://auth-service:8081
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=Enrollments-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://enrollment-service:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/enrollments/**

spring.cloud.gateway.server.webflux.routes[2].id=Course-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://course-catalog-service:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/courses/**


spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://notification-service:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**
